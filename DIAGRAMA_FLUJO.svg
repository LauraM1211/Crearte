<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title description">
  <title id="title">Diagrama visual de Crearte</title>
  <desc id="description">Flujo de inicio de sesión, registro de auditoría, almacenamiento, historial y generación de reportes de Crearte.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ca8a04"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { fill: #fff; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; }
      .lane-title { font-size: 17px; font-weight: 800; letter-spacing: 1.4px; }
      .node-title { font-size: 18px; font-weight: 750; }
      .node-copy { font-size: 14px; fill: #475569; }
      .file { font-size: 12px; font-weight: 700; fill: #64748b; }
      .small { font-size: 13px; fill: #475569; }
      .arrow-label { font-size: 13px; font-weight: 700; fill: #475569; }
      .white { fill: #fff; }
      .yellow { fill: #facc15; }
      .center { text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .line-yellow { fill: none; stroke: #ca8a04; stroke-width: 3; marker-end: url(#arrow-yellow); }
      .node { filter: url(#shadow); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#f1f5f9"/>
  <rect width="1600" height="132" fill="url(#header)"/>
  <rect y="126" width="1600" height="6" fill="#facc15"/>
  <text x="64" y="58" class="title">CREARTE · Flujo de la aplicación</text>
  <text x="66" y="94" class="subtitle">Cómo se conectan los módulos desde el acceso hasta el registro y sus reportes</text>
  <rect x="1324" y="42" width="210" height="42" rx="21" fill="#facc15"/>
  <text x="1429" y="69" class="center" font-size="14" font-weight="800">VISTA GENERAL</text>

  <!-- Lane 1: boot and authentication -->
  <rect x="48" y="162" width="1504" height="272" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <rect x="48" y="162" width="10" height="272" rx="5" fill="#eab308"/>
  <text x="78" y="197" class="lane-title" fill="#a16207">1 · INICIO Y AUTENTICACIÓN</text>

  <rect x="82" y="236" width="190" height="116" rx="16" class="node" fill="#fffbeb" stroke="#facc15"/>
  <text x="177" y="272" class="node-title center">Navegador</text>
  <text x="177" y="298" class="node-copy center">Abre la aplicación</text>
  <text x="177" y="329" class="file center">index.html</text>

  <path d="M272 294H324" class="line-yellow"/>
  <rect x="330" y="236" width="210" height="116" rx="16" class="node" fill="#fff" stroke="#cbd5e1"/>
  <text x="435" y="272" class="node-title center">Montaje React</text>
  <text x="435" y="298" class="node-copy center">Crea la raíz en #root</text>
  <text x="435" y="329" class="file center">src/main.jsx</text>

  <path d="M540 294H593" class="line"/>
  <rect x="600" y="236" width="220" height="116" rx="16" class="node" fill="#fff" stroke="#cbd5e1"/>
  <text x="710" y="272" class="node-title center">Componente App</text>
  <text x="710" y="298" class="node-copy center">Revisa estado de acceso</text>
  <text x="710" y="329" class="file center">src/App.jsx</text>

  <path d="M820 294H864" class="line"/>
  <path d="M928 230L994 294L928 358L862 294Z" class="node" fill="#fff7cc" stroke="#eab308"/>
  <text x="928" y="288" class="node-title center" font-size="16">¿Usuario</text>
  <text x="928" y="310" class="node-title center" font-size="16">activo?</text>

  <path d="M994 294H1040" class="line"/>
  <text x="1016" y="278" class="arrow-label center">Sí</text>
  <rect x="1047" y="236" width="210" height="116" rx="16" class="node" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1152" y="272" class="node-title center">Auditoría</text>
  <text x="1152" y="298" class="node-copy center">Formulario e historial</text>
  <text x="1152" y="329" class="file center">src/App.jsx</text>

  <path d="M928 358V426H1524V294H1518" class="line"/>
  <text x="965" y="418" class="arrow-label">No · mostrar acceso</text>
  <rect x="1283" y="222" width="230" height="142" rx="16" class="node" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1398" y="256" class="node-title center">Ingreso / Registro</text>
  <text x="1398" y="282" class="node-copy center">Formulario y recuperación</text>
  <text x="1398" y="310" class="file center">src/login.jsx</text>
  <text x="1398" y="335" class="file center">src/auth.js</text>
  <path d="M1257 294H1276" class="line"/>
  <text x="1267" y="278" class="arrow-label center">No</text>

  <rect x="1300" y="379" width="190" height="40" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1395" y="404" class="center" font-size="13" font-weight="700">Firebase Authentication</text>
  <path d="M1398 364V373" class="line"/>
  <text x="1380" y="425" class="file center">src/firebase.js</text>
  <path d="M1300 399H1268V335H1260" class="line"/>
  <text x="1268" y="386" class="arrow-label" text-anchor="end">Acceso correcto</text>

  <!-- Lane 2: audit and storage -->
  <rect x="48" y="458" width="1504" height="340" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <rect x="48" y="458" width="10" height="340" rx="5" fill="#10b981"/>
  <text x="78" y="493" class="lane-title" fill="#047857">2 · AUDITORÍA, CÁLCULO Y GUARDADO</text>

  <rect x="82" y="548" width="230" height="130" rx="16" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="197" y="584" class="node-title center">Datos del lote</text>
  <text x="197" y="611" class="node-copy center">Empresa · referencia · lote</text>
  <text x="197" y="636" class="node-copy center">Nivel de inspección · AQL</text>
  <text x="197" y="660" class="file center">src/App.jsx</text>

  <path d="M312 613H355" class="line"/>
  <rect x="362" y="548" width="230" height="130" rx="16" class="node" fill="#fffbeb" stroke="#facc15"/>
  <text x="477" y="584" class="node-title center">Plan de muestreo</text>
  <text x="477" y="611" class="node-copy center">Letra · muestra · límites Ac/Re</text>
  <text x="477" y="636" class="node-copy center">Cálculo automático AQL</text>
  <text x="477" y="660" class="file center">TABLA_I + AQL_PLANS</text>

  <path d="M592 613H635" class="line"/>
  <rect x="642" y="548" width="235" height="130" rx="16" class="node" fill="#fff7ed" stroke="#fb923c"/>
  <text x="759" y="584" class="node-title center">Hallazgos</text>
  <text x="759" y="611" class="node-copy center">Defectos · segundas</text>
  <text x="759" y="636" class="node-copy center">Comentarios · fotos</text>
  <text x="759" y="660" class="file center">Estado de Auditoria</text>

  <path d="M877 613H920" class="line"/>
  <rect x="927" y="548" width="225" height="130" rx="16" class="node" fill="#fef2f2" stroke="#fb7185"/>
  <text x="1039" y="584" class="node-title center">Dictamen</text>
  <text x="1039" y="611" class="node-copy center">Compara críticos y límites Re</text>
  <text x="1039" y="636" class="node-copy center">Aprobado · rechazado · pendiente</text>
  <text x="1039" y="660" class="file center">decisionFinal</text>

  <path d="M1152 613H1195" class="line"/>
  <rect x="1202" y="548" width="300" height="130" rx="16" class="node" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1352" y="584" class="node-title center">Guardar auditoría</text>
  <text x="1352" y="611" class="node-copy center">Valida campos mínimos y crea el registro</text>
  <text x="1352" y="636" class="node-copy center">Actualiza el historial de la pantalla</text>
  <text x="1352" y="660" class="file center">guardarAuditoria() · src/App.jsx</text>

  <path d="M1352 678V716H1080" class="line"/>
  <rect x="720" y="710" width="330" height="64" rx="15" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="885" y="738" class="node-title center" font-size="16">localStorage</text>
  <text x="885" y="759" class="small center">Historial local + fotos comprimidas</text>

  <path d="M1352 678V748H1060" class="line"/>
  <rect x="1080" y="710" width="422" height="64" rx="15" class="node" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1291" y="738" class="node-title center" font-size="16">Cloud Firestore · colección auditorias</text>
  <text x="1291" y="759" class="small center">src/db.js · guarda datos y cantidad de fotos</text>
  <text x="1084" y="696" class="arrow-label">Sincronización remota</text>

  <!-- Lane 3: history and outputs -->
  <rect x="48" y="822" width="1504" height="340" rx="20" fill="#fff" stroke="#e2e8f0"/>
  <rect x="48" y="822" width="10" height="340" rx="5" fill="#6366f1"/>
  <text x="78" y="857" class="lane-title" fill="#4338ca">3 · HISTORIAL Y SALIDAS</text>

  <rect x="90" y="916" width="260" height="132" rx="16" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="220" y="953" class="node-title center">Historial</text>
  <text x="220" y="981" class="node-copy center">Consultar, cargar o eliminar</text>
  <text x="220" y="1007" class="node-copy center">Registros locales y remotos</text>
  <text x="220" y="1030" class="file center">src/App.jsx + src/db.js</text>
  <path d="M220 916V866H885V782" class="line"/>
  <path d="M220 916V850H1291V782" class="line"/>
  <text x="718" y="843" class="arrow-label center">Leer / sincronizar historial</text>

  <path d="M350 982H412" class="line"/>
  <path d="M440 918L500 982L440 1046L380 982Z" class="node" fill="#eef2ff" stroke="#818cf8"/>
  <text x="440" y="977" class="node-title center" font-size="15">Elegir</text>
  <text x="440" y="998" class="node-title center" font-size="15">acción</text>

  <path d="M500 982H554V932H600" class="line"/>
  <text x="544" y="919" class="arrow-label">PDF</text>
  <rect x="608" y="888" width="290" height="88" rx="15" class="node" fill="#fff1f2" stroke="#fb7185"/>
  <text x="753" y="922" class="node-title center">Reporte PDF</text>
  <text x="753" y="947" class="node-copy center">Datos, decisión y fotos disponibles</text>
  <text x="753" y="966" class="file center">src/reportepdf.js</text>

  <path d="M500 982H554V1030H600" class="line"/>
  <text x="544" y="1050" class="arrow-label">Excel</text>
  <rect x="608" y="995" width="290" height="88" rx="15" class="node" fill="#ecfdf5" stroke="#34d399"/>
  <text x="753" y="1029" class="node-title center">Excel individual / consolidado</text>
  <text x="753" y="1054" class="node-copy center">Tabla HTML descargada como .xls</text>
  <text x="753" y="1073" class="file center">src/App.jsx</text>

  <path d="M500 982H930" class="line"/>
  <text x="708" y="968" class="arrow-label center">Cargar en formulario</text>
  <rect x="938" y="916" width="245" height="132" rx="16" class="node" fill="#fffbeb" stroke="#facc15"/>
  <text x="1060" y="953" class="node-title center">Reutilizar registro</text>
  <text x="1060" y="981" class="node-copy center">Copia datos al formulario</text>
  <text x="1060" y="1007" class="node-copy center">No elimina el registro guardado</text>
  <text x="1060" y="1030" class="file center">cargarRegistro()</text>

  <path d="M500 982H905V1094H1200" class="line"/>
  <text x="976" y="1080" class="arrow-label">Enviar resumen</text>
  <rect x="1208" y="1002" width="294" height="112" rx="16" class="node" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1355" y="1038" class="node-title center">Correo · EmailJS</text>
  <text x="1355" y="1065" class="node-copy center">Envía resumen HTML de auditoría</text>
  <text x="1355" y="1091" class="file center">src/App.jsx · archivos no adjuntados</text>

  <rect x="64" y="1180" width="1472" height="38" rx="12" fill="#fff7cc"/>
  <text x="800" y="1205" class="center" font-size="14" font-weight="700" fill="#854d0e">Nota: las reglas de Firestore deben aplicar los permisos; la comprobación de administrador en frontend no protege los datos.</text>
</svg>
